name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same gates as ci.yml. A direct push to main or a manual dispatch never
      # passes through a pull request, so without this a broken config could
      # reach Pages unchecked.
      - name: Check configuration
        run: node scripts/sd365.mjs doctor

      - name: Validate content
        run: node scripts/sd365.mjs validate

      - name: Build site
        run: node scripts/sd365.mjs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
